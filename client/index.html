<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>syncsofa</title>
    <script>
      // Set the theme attribute before first paint so there's no flash of the wrong theme.
      // Synchronous + inline: this has to run before the stylesheet paints, not after.
      (function () {
        var known = ['living-room', 'late-show', 'signal', 'matinee', 'nightgarden'];
        var saved = localStorage.getItem('syncsofa-theme');
        document.documentElement.dataset.theme = known.indexOf(saved) === -1 ? 'living-room' : saved;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Recursive:CASL,wght@1,300..900&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
