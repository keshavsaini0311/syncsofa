# fly.toml — edit `app` (must be globally unique) and `primary_region`
# before `fly deploy`. See README "Deploy" for the full walkthrough.

app = "CHANGE-ME-syncsofa"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/syncsofa.db"
  # TURN_URL / TURN_USERNAME / TURN_CREDENTIAL are optional and should be set
  # as secrets, not plain env vars:
  #   fly secrets set TURN_URL=... TURN_USERNAME=... TURN_CREDENTIAL=...

[[mounts]]
  source = "syncsofa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
